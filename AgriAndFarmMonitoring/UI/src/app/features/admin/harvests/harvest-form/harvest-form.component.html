<div class="bg-white rounded-xl max-w-[620px] w-full">
  <div class="flex justify-between items-center px-6 py-4 border-b border-outline-variant">
    <div class="flex items-center gap-3">
      <mat-icon class="text-primary text-2xl w-6 h-6">edit</mat-icon>
      <h2 class="text-xl font-semibold m-0 text-on-surface">Edit Harvest</h2>
    </div>
    <button mat-icon-button (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="harvestForm" class="flex flex-col">
    <div class="px-6 py-4 max-h-[70vh] overflow-y-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Harvest Date</mat-label>
          <input matInput type="date" formControlName="harvestDate">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Quantity (kg) *</mat-label>
          <input matInput type="number" formControlName="quantityKg" min="0.1" step="0.1">
          <mat-error>Enter a valid quantity</mat-error>
        </mat-form-field>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Quality Grade</mat-label>
          <mat-select formControlName="qualityGrade">
            <mat-option value="">Select grade</mat-option>
            <mat-option *ngFor="let g of qualityGrades" [value]="g">{{ formatQualityGrade(g) }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Harvest Method</mat-label>
          <mat-select formControlName="harvestMethod">
            <mat-option value="">Select method</mat-option>
            <mat-option *ngFor="let m of harvestMethods" [value]="m">{{ formatHarvestMethod(m) }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Price per kg</mat-label>
          <input matInput type="number" formControlName="pricePerKg" min="0" step="0.01">
          <span matPrefix class="text-on-surface">$</span>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Batch Number</mat-label>
          <input matInput formControlName="batchNumber">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="w-full mt-2">
        <mat-label>Notes</mat-label>
        <textarea matInput formControlName="notes" rows="3"></textarea>
      </mat-form-field>

      <div class="flex items-center gap-2 pt-4 pb-3 border-b border-outline-variant mt-2">
        <mat-icon class="text-primary">photo_camera</mat-icon>
        <span class="font-semibold text-on-surface">Photo Documentation</span>
      </div>

      <!-- Main Photo -->
      <div class="mt-3">
        <label class="font-medium text-sm text-on-surface block mb-2">Main Harvest Photo</label>
        <div class="relative inline-block rounded-lg border border-outline-variant overflow-hidden" *ngIf="mainPhotoPreviewUrl">
          <img [src]="mainPhotoPreviewUrl" class="max-h-[200px] w-full object-contain" alt="Main harvest photo" />
          <button type="button" mat-icon-button class="absolute top-1 right-1 bg-black/60 text-white hover:bg-black/80 w-8 h-8" (click)="removeMainPhoto()">
            <mat-icon class="text-sm w-4 h-4">close</mat-icon>
          </button>
        </div>
        
        <div class="border-2 border-dashed border-outline-variant rounded-lg p-5 text-center hover:border-primary transition-colors" *ngIf="!mainPhotoPreviewUrl && !isSaving">
          <label class="cursor-pointer flex flex-col items-center gap-2">
            <mat-icon class="text-4xl w-9 h-9 text-outline">cloud_upload</mat-icon>
            <span class="text-sm text-on-surface-variant">Choose main photo</span>
            <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onFileSelected($event)" hidden>
          </label>
        </div>
      </div>

      <!-- Reference Photos -->
      <div class="mt-4">
        <label class="font-medium text-sm text-on-surface block mb-2">Additional Reference Photos</label>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-3" *ngIf="referencePhotoPreviews.length > 0">
          <div class="relative rounded-lg border border-outline-variant overflow-hidden aspect-square" *ngFor="let rp of referencePhotoPreviews; let i = index">
            <img [src]="rp.url" class="w-full h-full object-cover" alt="Reference photo" />
            <button type="button" mat-icon-button class="absolute top-1 right-1 bg-black/60 text-white hover:bg-black/80 w-6 h-6" (click)="removeReferencePhoto(i)">
              <mat-icon class="text-xs w-3 h-3">close</mat-icon>
            </button>
          </div>
        </div>
        <div class="border-2 border-dashed border-outline-variant rounded-lg p-4 text-center hover:border-primary transition-colors">
          <label class="cursor-pointer flex flex-col items-center gap-2">
            <mat-icon class="text-3xl w-8 h-8 text-outline">add_photo_alternate</mat-icon>
            <span class="text-sm text-on-surface-variant">Add more photos</span>
            <input type="file" accept="image/jpeg,image/png,image/webp" multiple (change)="onMultipleFilesSelected($event)" hidden>
          </label>
        </div>
      </div>

      <mat-form-field appearance="outline" class="w-full mt-3">
        <mat-label>Photo Caption</mat-label>
        <input matInput formControlName="imageCaption">
      </mat-form-field>
    </div>

    <div *ngIf="isSaving" class="px-6 py-3 bg-surface border-t border-outline-variant">
      <mat-progress-bar mode="determinate" [value]="uploadProgress" class="rounded-full"></mat-progress-bar>
      <span class="block mt-1.5 text-sm text-on-surface-variant text-center">{{ uploadStatus }}</span>
    </div>

    <div class="flex justify-end gap-2 px-6 py-4 border-t border-outline-variant">
      <button mat-button type="button" (click)="closeDialog()" [disabled]="isSaving">Cancel</button>
      <button mat-raised-button color="primary" (click)="save()" [disabled]="harvestForm.invalid || isSaving" class="min-w-[120px]">
        <mat-spinner [diameter]="20" *ngIf="isSaving"></mat-spinner>
        <span *ngIf="!isSaving">Update Harvest</span>
      </button>
    </div>
  </form>
</div>
