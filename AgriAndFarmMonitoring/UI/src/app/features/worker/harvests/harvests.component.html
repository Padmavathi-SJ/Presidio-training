<!-- src/app/features/worker/harvests/harvests.component.html -->
<div class="min-h-screen bg-surface">
  <!-- Main Content -->
  <div class="max-w-[1440px] mx-auto">
    <!-- Harvest List -->
    <app-harvest-list
      (createHarvest)="openCreateForm()"
      (editHarvest)="openEditForm($event)"
      (viewHarvest)="viewDetails($event)"
      (respondHarvest)="openRespondDialog($event)"
      (deleteHarvest)="deleteHarvest($event)">
    </app-harvest-list>

    <!-- Harvest Form (Hidden by default, opened via dialog) -->
    <app-harvest-form
      #harvestForm
      [editingId]="editingId"
      [editData]="editData"
      (saved)="onFormSaved()"
      (cancelled)="onFormCancelled()">
    </app-harvest-form>
  </div>
</div>
