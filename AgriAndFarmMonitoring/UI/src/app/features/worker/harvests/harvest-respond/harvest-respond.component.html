<div class="bg-white rounded-xl max-w-[500px] w-full">
  <div class="flex justify-between items-center px-6 py-4 border-b border-outline-variant">
    <div class="flex items-center gap-3">
      <mat-icon class="text-primary text-2xl w-6 h-6">feedback</mat-icon>
      <h2 class="text-xl font-semibold m-0 text-on-surface">Respond to Admin</h2>
    </div>
    <button mat-icon-button (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  
  <form [formGroup]="respondForm" class="flex flex-col">
    <div class="px-6 py-4">
      <p class="text-sm text-surface-on-variant mb-4">
        Please provide a response regarding the requested changes or rejection for this harvest.
      </p>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Your Response *</mat-label>
        <textarea matInput formControlName="responseNotes" rows="4" placeholder="Explain the corrections made or answer the admin's query..."></textarea>
        <mat-error *ngIf="respondForm.get('responseNotes')?.hasError('required')">Response is required</mat-error>
        <mat-error *ngIf="respondForm.get('responseNotes')?.hasError('minlength')">Response must be at least 5 characters</mat-error>
      </mat-form-field>
    </div>
    
    <div class="flex justify-end gap-2 px-6 py-4 border-t border-outline-variant">
      <button type="button" mat-button (click)="closeDialog()" [disabled]="isSubmitting()">Cancel</button>
      <button mat-raised-button color="primary" (click)="save()" [disabled]="respondForm.invalid || isSubmitting()">
        <span *ngIf="!isSubmitting()">Submit Response</span>
        <span *ngIf="isSubmitting()">Submitting...</span>
      </button>
    </div>
  </form>
</div>
