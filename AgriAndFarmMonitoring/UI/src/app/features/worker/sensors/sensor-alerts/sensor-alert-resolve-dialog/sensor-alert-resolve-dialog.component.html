<h2 mat-dialog-title>Resolve Sensor Alert</h2>
<mat-dialog-content>
  <div class="mb-4 text-sm text-gray-700">
    <p><strong>Alert Type:</strong> {{ alert.alertType }}</p>
    <p><strong>Message:</strong> {{ alert.message }}</p>
    <p><strong>Field:</strong> {{ alert.fieldName || 'Unknown' }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 mt-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Resolution Notes</mat-label>
      <textarea matInput formControlName="resolutionNotes" rows="4" 
                placeholder="Describe what action was taken to resolve this alert..."></textarea>
      <mat-error *ngIf="form.get('resolutionNotes')?.hasError('required')">
        Resolution notes are required
      </mat-error>
      <mat-error *ngIf="form.get('resolutionNotes')?.hasError('maxlength')">
        Maximum length is 1000 characters
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="onSubmit()" [disabled]="form.invalid">Resolve Alert</button>
</mat-dialog-actions>
