<!-- Worker Panel Layout — Professional Agriculture Theme -->
<div class="h-screen flex flex-col bg-[#f5f8f5] overflow-hidden">

  <!-- ═══ TOPBAR ════════════════════════════════════════════ -->
  <header class="worker-topbar">

    <!-- LEFT: Menu Toggle + Brand -->
    <div class="topbar-left">
      <button
        mat-icon-button
        (click)="toggleSidebar()"
        class="topbar-icon-btn"
        aria-label="Toggle sidebar"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <div class="topbar-brand">
        <span class="brand-emoji">🌱</span>
        <span class="brand-name">AgriMonitor</span>
        <span class="brand-badge">Worker</span>
      </div>
    </div>

    <!-- CENTER: Route Title -->
    <div class="topbar-center">
      <span class="topbar-highlight-title">
        <mat-icon>{{ currentRouteIcon() }}</mat-icon>
        {{ currentRoute() }}
      </span>
    </div>

    <!-- RIGHT: Notifications + User -->
    <div class="topbar-right">
      <app-notification-menu></app-notification-menu>
      <span class="topbar-user-name">{{ user?.name }}</span>
      <button
        mat-icon-button
        [matMenuTriggerFor]="userMenu"
        class="topbar-icon-btn"
        aria-label="User menu"
      >
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item routerLink="/worker/profile">
          <mat-icon>person</mat-icon><span>My Profile</span>
        </button>
        <button mat-menu-item routerLink="/worker/settings">
          <mat-icon>settings</mat-icon><span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" class="!text-red-600">
          <mat-icon class="!text-red-500">logout</mat-icon><span>Logout</span>
        </button>
      </mat-menu>
    </div>

  </header>

  <!-- ═══ BODY: Sidebar + Content ══════════════════════════ -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- Mobile overlay -->
    <div
      class="sidebar-overlay"
      [class.visible]="isMobileOverlayVisible()"
      (click)="toggleSidebar()"
    ></div>

    <!-- ── SIDEBAR ─────────────────────────────────── -->
    <nav
      class="worker-sidebar"
      [class.collapsed]="!isSidebarOpen()"
      [class.mobile-hidden]="isMobileHidden()"
    >
      <!-- Farm Header -->
      <div class="sidebar-farm-header">
        <div class="farm-avatar">
          <mat-icon>agriculture</mat-icon>
        </div>
        <div class="farm-info" [class.hidden]="!isSidebarOpen()">
          <div class="farm-name">{{ user?.farmName || 'My Farm' }}</div>
          <div class="farm-role">Field Worker</div>
        </div>
      </div>

      <!-- Nav Items -->
      <div class="sidebar-nav">
        <div class="sidebar-section-label">Navigation</div>

        @for (item of navItems; track item.route) {
          <a
            class="sidebar-nav-item"
            [routerLink]="item.route"
            routerLinkActive="active-link"
            [matTooltip]="!isSidebarOpen() ? item.label : ''"
            matTooltipPosition="right"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </div>

      <!-- Footer Links -->
      <div class="sidebar-footer">
        <a class="sidebar-footer-item" routerLink="/worker/profile">
          <mat-icon>person_outline</mat-icon>
          <span>Profile</span>
        </a>
        <div class="sidebar-footer-item danger" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </div>
      </div>
    </nav>

    <!-- ── MAIN CONTENT ────────────────────────────── -->
    <main class="worker-content-area flex-1">
      <div class="worker-content-inner">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
