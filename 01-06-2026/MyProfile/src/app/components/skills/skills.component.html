<div class="skills-container py-8 md:py-16 px-4 sm:px-6 md:px-8 lg:px-16 bg-transparent">
  
  <div class="text-center mb-6 md:mb-10">
    <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-200">Technical Skills</h2>
    <div class="w-20 h-1 bg-blue-500 mx-auto mt-2 rounded-full"></div>
  </div>

  <div class="skills-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4 md:gap-6">
    @for (skill of skillsData; track skill.name) {
      <div class="skill-card relative flex items-center border border-[#99c2ff] rounded-lg p-2 sm:p-3 md:p-4
                  bg-[rgba(255,255,255,0.05)] backdrop-blur-lg shadow-sm md:shadow-md transition-all 
                  transform hover:-translate-y-1 hover:border-blue-400 hover:shadow-lg hover:shadow-blue-500/50">
        
        <img [src]="skill.icon" [alt]="skill.name" 
             class="skill-icon w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 object-cover rounded-md shadow-sm mr-2 sm:mr-3 md:mr-4" />
        
        <div class="flex-1 min-w-0">
          <h3 class="skill-name text-xs sm:text-sm md:text-base font-medium text-gray-100 truncate">{{ skill.name }}</h3>
          
          <div class="skill-bar-container w-full bg-gray-300 rounded-full h-1 sm:h-1.5 md:h-2 mt-1 sm:mt-2">
            <div class="skill-bar bg-[#99c2ff] h-full rounded-full transition-all duration-1000 ease-out"
                 [style.width]="isVisible ? skill.level + '%' : '0%'">
            </div>
          </div>
          
          <span class="skill-percentage text-xs text-gray-400">{{ skill.level }}%</span>
        </div>
      </div>
    }
  </div>
</div>
