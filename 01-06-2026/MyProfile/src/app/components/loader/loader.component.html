@if (loading) {
  <div class="loader-container">
    <div class="flex items-center justify-center min-h-screen bg-gray-900 text-white">
      <div class="flex flex-col items-center">
        
        <!-- Animated Code Icon -->
        <div class="animate-slide-down mb-2 sm:mb-4">
          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="60" 
            height="60" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            class="text-blue-500 animate-pulse"
          >
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        
        <!-- Animated Text -->
        <div class="font-mono text-xl sm:text-2xl md:text-3xl">
          @for (char of characters; track $index) {
            <span 
              class="inline-block opacity-0 text-blue-400 animate-slide-in"
              [style.animation-delay]="$index * 0.05 + 's'">
              {{ char }}
            </span>
          }
        </div>
        
        <!-- Loading Dots -->
        <div class="flex gap-2 justify-center items-center mt-4">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        
      </div>
    </div>
  </div>
}
