<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold">Hire Me</h2>
      <button (click)="closePanel()" class="text-gray-500 hover:text-gray-700">
        ✕
      </button>
    </div>
    <div class="space-y-4">
      <!-- Add your profile panel content here -->
      <p>Contact information and hiring details</p>
      <div class="flex justify-end">
        <button (click)="closePanel()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
