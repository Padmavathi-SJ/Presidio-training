<div class="top-bar fixed top-0 left-0 md:left-16 w-full md:w-[calc(100%-4rem)] flex items-center justify-between bg-[var(--secondary-bg)] shadow-md px-4 py-2 z-40">
  
  <!-- Logo and Title -->
  <div class="flex flex-col md:flex-row md:items-baseline space-y-1 md:space-y-0 md:space-x-3">
    <h1 class="text-[#B0C4DE] font-semibold text-sm md:text-base tracking-wide">
      &lt;Padmavathi SJ /&gt;
    </h1>
    <span class="text-[#B0C4DE] text-xs md:text-sm font-medium italic">
      {{ '{' }}{{ '{' }}Full Stack Developer{{ '}' }}{{ '}' }}
    </span>
  </div>

  <!-- Social Media Icons with Tooltips -->
  <div class="flex space-x-3 md:space-x-5">
    <div class="tooltip-container">
      <a 
        [href]="linkedinUrl" 
        target="_blank" 
        rel="noopener noreferrer"
        class="social-link">
        <img src="assets/linkedin.png" alt="LinkedIn" class="social-icon w-6 h-6 md:w-8 md:h-8" />
      </a>
      <span class="tooltip-text">LinkedIn</span>
    </div>
    
    <div class="tooltip-container">
      <a 
        [href]="githubUrl" 
        target="_blank" 
        rel="noopener noreferrer"
        class="social-link">
        <img src="assets/github.png" alt="GitHub" class="social-icon w-6 h-6 md:w-8 md:h-8" />
      </a>
      <span class="tooltip-text">GitHub</span>
    </div>
    
    <div class="tooltip-container">
      <a 
        [href]="telegramUrl" 
        target="_blank" 
        rel="noopener noreferrer"
        class="social-link">
        <img src="assets/telegram.png" alt="Telegram" class="social-icon w-6 h-6 md:w-8 md:h-8" />
      </a>
      <span class="tooltip-text">Telegram</span>
    </div>
    
    <div class="tooltip-container">
      <a 
        [href]="'mailto:' + emailAddress" 
        target="_blank" 
        rel="noopener noreferrer"
        class="social-link">
        <img src="assets/gmail.png" alt="Gmail" class="social-icon w-6 h-6 md:w-8 md:h-9" />
      </a>
      <span class="tooltip-text">Email</span>
    </div>
  </div>
</div>
