<div class="HomeBanner relative flex flex-col items-center justify-center w-full min-h-screen bg-transparent pt-16 md:pt-0 px-4">

  <!-- Quote Box - Adjusted for mobile -->
  <div class="quote-box absolute top-16 md:top-10 flex justify-center w-full px-2">
    <div class="text-white px-4 py-2 rounded-lg shadow-md text-center text-sm md:text-lg font-semibold border border-gray-500">
      <span class="text-xl md:text-3xl text-yellow-300 font-bold">
        {{ displayText }}<span class="animate-blink">|</span>
      </span>
    </div>
  </div>

  <!-- Main Banner Section - Stacked on mobile, side-by-side on desktop -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full md:w-3/4 max-w-6xl items-center mt-20 md:mt-0">
    
    <!-- Left Side - Developer Info -->
    <div class="developer-info flex flex-col space-y-4 text-white order-2 md:order-1 text-center-mobile">
      <h1 class="text-3xl md:text-4xl font-bold text-white">
        Hi, I'm <span class="text-blue-400">Padmavathi SJ</span>
      </h1>
      <h2 class="text-xl md:text-2xl font-semibold text-yellow-200">
        Full Stack Developer
      </h2>
      <p class="text-sm md:text-base text-white">
        I build dynamic, scalable web applications using 
        <span class="text-blue-400 font-semibold"> React, Node.js,</span> and 
        <span class="text-blue-400 font-semibold"> cloud technologies</span>. 
        Passionate about problem-solving, backend optimization, and deploying 
        efficient solutions in the cloud.
      </p>
      <div class="flex justify-center md:justify-start">
        <a
          href="https://github.com/Padmavathi-SJ/PadmavathiSJ"
          target="_blank"
          rel="noopener noreferrer"
          class="btn text-white font-semibold px-4 py-2 text-sm md:text-base md:px-5 md:py-2 rounded-lg shadow-lg border border-blue-500 transition-all duration-300 hover:bg-blue-500 hover:shadow-xl"
        >
          View My Work
        </a>
      </div>
    </div>

    <!-- Right Side - Main Image & Skills -->
    <div class="relative flex justify-center items-center order-1 md:order-2">
      
      <!-- Main Image - Smaller on mobile -->
      <div class="main-image relative w-64 h-80 md:w-80 md:h-96 transition-transform duration-700 transform hover:scale-110 hover:rotate-3 hover:shadow-2xl animate-floatSlow">
        <img
          src="assets/home3.jpg"
          alt="Developer"
          class="responsive-img w-full h-full object-cover rounded-lg shadow-2xl border border-gray-500"
        />

        <!-- Skill Images on Main Image - Smaller on mobile -->
        <img src="assets/react.png" alt="React" class="absolute top-2 left-8 w-10 h-10 md:w-14 md:h-14 shadow-lg animate-spinSlow" />
        <img src="assets/nodejs.png" alt="Node.js" class="absolute bottom-2 right-6 w-12 h-12 md:w-16 md:h-16 shadow-lg animate-floatFast" />
      </div>

      <!-- Floating Skill Images - Fewer on mobile -->
      <div class="skill-icons hidden md:flex absolute flex-wrap justify-center items-center w-full h-full">
        <img src="assets/letter-c.png" alt="C" class="absolute top-0 left-8 w-14 h-14 shadow-lg animate-bounceSlow" />
        <img src="assets/java.png" alt="Java" class="absolute bottom-30 right-10 w-16 h-16 shadow-lg animate-pulseFast" />
        <img src="assets/sql-server.png" alt="SQL" class="absolute bottom-30 left-6 w-14 h-14 shadow-lg animate-spinSlow" />
        <img src="assets/AWS.png" alt="AWS" class="absolute bottom-4 left-16 w-16 h-16 shadow-lg animate-floatFast" />
        <img src="assets/docker.png" alt="Docker" class="absolute top-24 right-8 w-14 h-14 shadow-lg animate-wiggle" />
        <img src="assets/git.png" alt="TypeScript" class="absolute top-52 left-20 w-14 h-14 shadow-lg animate-pulseFast" />
        <img src="assets/java-script.png" alt="MongoDB" class="absolute bottom-6 right-12 w-16 h-16 shadow-lg animate-floatMid" />
        <img src="assets/mysql.png" alt="Python" class="absolute top-40 left-32 w-16 h-16 shadow-lg animate-bounceSlow" />
        <img src="assets/html-5.png" alt="Kubernetes" class="absolute top-4 right-20 w-14 h-14 shadow-lg animate-spinSlow" />
      </div>
    </div>
  </div>
</div>
